<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Battle for Wesnoth (tarayıcı önizlemesi)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #e8dcc0; font-family: Georgia, serif; overflow: hidden; }
  #canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #0b0a08; text-align: center; padding: 24px; z-index: 5; }
  #overlay.translucent { background: rgba(11, 10, 8, 0.88); }
  #overlay h1 { font-weight: normal; font-size: 28px; margin: 0; letter-spacing: 0.04em; }
  #status { font-size: 15px; opacity: 0.85; min-height: 1.4em; }
  #bar { width: min(420px, 80vw); height: 6px; background: #2a2620; border-radius: 3px; overflow: hidden; }
  #bar > div { height: 100%; width: 0; background: #c9a85a; transition: width 0.2s; }
  #error { display: none; max-width: 640px; font-size: 14px; color: #f0a0a0; white-space: pre-wrap; text-align: left; }
  #note { font-size: 12px; opacity: 0.55; max-width: 520px; }
  #badge { display: none; position: fixed; left: 50%; bottom: 6px; transform: translateX(-50%); padding: 3px 10px; border-radius: 10px; background: rgba(0,0,0,0.65); color: #c9a85a; font: 12px Georgia, serif; z-index: 4; pointer-events: none; }
  #debuglog { display: none; position: fixed; right: 0; bottom: 0; width: 50vw; height: 40vh; overflow: auto; background: rgba(0,0,0,0.85); color: #9f9; font: 11px monospace; white-space: pre-wrap; z-index: 10; padding: 6px; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="badge"></div>
<div id="debuglog"></div>
<div id="overlay">
  <h1>The Battle for Wesnoth</h1>
  <div id="status">Yükleniyor…</div>
  <div id="bar"><div></div></div>
  <div id="error"></div>
  <div id="note">Deneysel tarayıcı sürümü. Güncel bir Chrome veya Edge gerekir (WebAssembly JSPI).
    Wesnoth özgür bir yazılımdır (GPL-2.0-or-later), bkz. wesnoth.org.</div>
</div>
<script>
  "use strict";
  const params = new URLSearchParams(location.search);
  const overlay = document.getElementById("overlay");
  const statusEl = document.getElementById("status");
  const barEl = document.querySelector("#bar > div");
  const errorEl = document.getElementById("error");
  const badgeEl = document.getElementById("badge");

  // Every line the game prints is kept in window.wesnothLog (and shown with ?debug).
  window.wesnothLog = [];
  const debugEl = document.getElementById("debuglog");
  const debugOn = params.has("debug");
  if (debugOn) { debugEl.style.display = "block"; }
  function logLine(kind, text) {
    window.wesnothLog.push(kind + " " + text);
    if (window.wesnothLog.length > 5000) { window.wesnothLog.shift(); }
    if (debugOn) {
      debugEl.textContent += kind + " " + text + "\n";
      debugEl.scrollTop = debugEl.scrollHeight;
    }
  }

  function showError(text) {
    overlay.style.display = "flex";
    errorEl.style.display = "block";
    errorEl.textContent = text;
    statusEl.textContent = "Bir sorun oluştu.";
  }

  if (typeof WebAssembly.Suspending !== "function") {
    showError("Bu tarayıcı henüz WebAssembly JSPI desteklemiyor.\nLütfen Chrome veya Edge'in güncel bir sürümünü kullanın.");
  }

  // --- Background data -------------------------------------------------
  // Only the "core" package is needed for the title screen. The others
  // (list written by package.sh into window.wesnothBackgroundPackages) are
  // fetched one by one once the game runs. The game calls
  // Module.wesnothWaitForData() before it shows a map, and watches
  // Module.wesnothDataVersion to refresh its image caches.
  const background = {
    names: window.wesnothBackgroundPackages || [],
    done: new Set(),
    waiting: false,
  };
  background.ready = new Promise((resolve) => { background.resolve = resolve; });
  if (background.names.length === 0) { background.resolve(); }

  function percentOf(text) {
    // file_packager status: "Downloading data... (12345/67890)"
    const m = text && text.match(/\((\d+(?:\.\d+)?)\/(\d+)\)/);
    return m ? Math.floor(100 * Number(m[1]) / Number(m[2])) : null;
  }

  function backgroundProgress(pct) {
    const n = background.names.length;
    const total = n ? Math.floor(((background.done.size + (pct || 0) / 100) / n) * 100) : 100;
    if (background.done.size >= n) {
      badgeEl.style.display = "none";
      return;
    }
    badgeEl.style.display = "block";
    badgeEl.textContent = "Oyun verileri arka planda indiriliyor… %" + total;
    if (background.waiting) {
      barEl.style.width = total + "%";
      statusEl.textContent = "Harita için oyun verileri indiriliyor… %" + total;
    }
  }

  function loadNextBackgroundPackage() {
    const next = background.names.find((n) => !background.done.has(n) && !background.started?.has(n));
    if (!next) { return; }
    (background.started ??= new Set()).add(next);
    const script = document.createElement("script");
    script.src = next + ".js";
    script.onerror = () => logLine("js-error", "could not load " + script.src);
    document.body.appendChild(script);
  }

  function onPackageUnpacked(name) {
    if (!background.names.includes(name) || background.done.has(name)) { return; }
    background.done.add(name);
    Module.wesnothDataVersion = (Module.wesnothDataVersion | 0) + 1;
    logLine("data", "unpacked " + name);
    backgroundProgress(0);
    if (background.done.size >= background.names.length) {
      background.resolve();
    } else {
      loadNextBackgroundPackage();
    }
  }

  var Module = {
    canvas: document.getElementById("canvas"),
    arguments: ["--data-dir=/wesnoth", "--userdata-dir=/userdata", "--nomusic", "--windowed", "--no-log-to-file"],
    print: (text) => { logLine("out", text); console.log(text); },
    printErr: (text) => { logLine("err", text); console.warn(text); },
    setStatus: (text) => {
      if (!text) { return; }
      const pct = percentOf(text);
      if (window.wesnothStarted) {
        backgroundProgress(pct);
        return;
      }
      if (pct !== null) {
        barEl.style.width = pct + "%";
        statusEl.textContent = "Oyun verileri indiriliyor… %" + pct;
      }
    },
    wesnothDataVersion: 0,
    wesnothWaitForData: async () => {
      if (background.done.size >= background.names.length) { return; }
      background.waiting = true;
      overlay.classList.add("translucent");
      overlay.style.display = "flex";
      backgroundProgress(0);
      await background.ready;
      background.waiting = false;
      overlay.style.display = "none";
    },
    preRun: [() => {
      // Language: Turkish by default, ?lang=en (or any locale) to override.
      // The game uses this until a language is picked in its preferences.
      const lang = params.get("lang") || "tr_TR";
      const locale = (lang === "en" ? "en_US" : lang).replace("-", "_");
      Module.ENV.LANG = locale + ".UTF-8";
      Module.ENV.LANGUAGE = locale;

      // Saves, preferences and add-ons live in IndexedDB.
      const FS = Module.FS;
      FS.mkdir("/userdata");
      const IDBFS = Module.IDBFS || (FS.filesystems && FS.filesystems.IDBFS) || window.IDBFS;
      FS.mount(IDBFS, { autoPersist: true }, "/userdata");
      Module.addRunDependency("syncfs-userdata");
      FS.syncfs(true, (err) => {
        if (err) { console.warn("Could not load saved data:", err); }
        Module.removeRunDependency("syncfs-userdata");
      });
    }],
    onRuntimeInitialized: () => {
      window.wesnothStarted = true;
      statusEl.textContent = "Başlatılıyor…";
      barEl.style.width = "100%";
      setTimeout(() => { if (!background.waiting) { overlay.style.display = "none"; } }, 300);

      // Packages call Module.removeRunDependency("datafile_<path>/<name>.data")
      // once their files are in place.
      const removeRunDependency = Module.removeRunDependency;
      Module.removeRunDependency = (id) => {
        removeRunDependency(id);
        const m = /([\w-]+)\.data$/.exec(String(id));
        if (m) { onPackageUnpacked(m[1]); }
      };
      // Give the title screen a moment before the downloads compete with it.
      setTimeout(loadNextBackgroundPackage, 1500);
    },
    onExit: (code) => { logLine("exit", String(code)); },
    onAbort: (what) => {
      logLine("abort", String(what));
      showError("Oyun durdu: " + what + "\nAyrıntılar için tarayıcı konsolunu (F12) açın.");
    },
  };

  // Fallback persistence in case autoPersist is not available.
  setInterval(() => {
    if (window.wesnothStarted && Module.FS) {
      Module.FS.syncfs(false, (err) => { if (err) { console.warn("syncfs:", err); } });
    }
  }, 15000);

  window.addEventListener("error", (e) => { logLine("js-error", String(e.message || e)); showError(String(e.message || e)); });
  function describeError(err) {
    if (err instanceof WebAssembly.Exception && Module.getExceptionMessage) {
      try {
        const [type, message] = Module.getExceptionMessage(err);
        return "C++ exception " + type + ": " + message + "\n" + (err.stack || "");
      } catch (e) { /* fall through */ }
    }
    return String(err && (err.stack || err));
  }
  window.addEventListener("unhandledrejection", (e) => {
    const text = describeError(e.reason);
    logLine("js-rejection", text);
    showError(text);
  });
</script>
<!-- PACKAGES -->
<script src="wesnoth.js"></script>
</body>
</html>
