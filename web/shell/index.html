<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Battle for Wesnoth (browser preview)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #e8dcc0; font-family: Georgia, serif; overflow: hidden; }
  #canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #0b0a08; text-align: center; padding: 24px; }
  #overlay h1 { font-weight: normal; font-size: 28px; margin: 0; letter-spacing: 0.04em; }
  #status { font-size: 15px; opacity: 0.85; min-height: 1.4em; }
  #bar { width: min(420px, 80vw); height: 6px; background: #2a2620; border-radius: 3px; overflow: hidden; }
  #bar > div { height: 100%; width: 0; background: #c9a85a; transition: width 0.2s; }
  #error { display: none; max-width: 640px; font-size: 14px; color: #f0a0a0; white-space: pre-wrap; text-align: left; }
  #note { font-size: 12px; opacity: 0.55; max-width: 520px; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="overlay">
  <h1>The Battle for Wesnoth</h1>
  <div id="status">Loading…</div>
  <div id="bar"><div></div></div>
  <div id="error"></div>
  <div id="note">Experimental browser build. Needs a recent Chrome or Edge (WebAssembly JSPI).
    Wesnoth is free software (GPL-2.0-or-later), see wesnoth.org.</div>
</div>
<script>
  "use strict";
  const overlay = document.getElementById("overlay");
  const statusEl = document.getElementById("status");
  const barEl = document.querySelector("#bar > div");
  const errorEl = document.getElementById("error");

  function showError(text) {
    errorEl.style.display = "block";
    errorEl.textContent = text;
    statusEl.textContent = "Something went wrong.";
  }

  if (typeof WebAssembly.Suspending !== "function") {
    showError("This browser does not support WebAssembly JSPI yet.\nPlease use a recent version of Chrome or Edge.");
  }

  var Module = {
    canvas: document.getElementById("canvas"),
    arguments: ["--data-dir=/wesnoth", "--userdata-dir=/userdata", "--nomusic", "--windowed"],
    print: (text) => console.log(text),
    printErr: (text) => console.warn(text),
    setStatus: (text) => {
      if (!text) { return; }
      // "Downloading data... (12345/67890)"
      const m = text.match(/\((\d+(?:\.\d+)?)\/(\d+)\)/);
      if (m) {
        const pct = Math.floor(100 * Number(m[1]) / Number(m[2]));
        barEl.style.width = pct + "%";
        statusEl.textContent = "Downloading game data… " + pct + "%";
      } else {
        statusEl.textContent = text;
      }
    },
    preRun: [() => {
      // Saves, preferences and add-ons live in IndexedDB.
      const FS = Module.FS;
      FS.mkdir("/userdata");
      FS.mount(FS.filesystems.IDBFS, { autoPersist: true }, "/userdata");
      Module.addRunDependency("syncfs-userdata");
      FS.syncfs(true, (err) => {
        if (err) { console.warn("Could not load saved data:", err); }
        Module.removeRunDependency("syncfs-userdata");
      });
    }],
    onRuntimeInitialized: () => {
      window.wesnothStarted = true;
      statusEl.textContent = "Starting…";
      barEl.style.width = "100%";
      setTimeout(() => { overlay.style.display = "none"; }, 300);
    },
    onAbort: (what) => {
      overlay.style.display = "flex";
      showError("The game stopped: " + what + "\nOpen the browser console (F12) for details.");
    },
  };

  // Fallback persistence in case autoPersist is not available.
  setInterval(() => {
    if (window.wesnothStarted && Module.FS) {
      Module.FS.syncfs(false, (err) => { if (err) { console.warn("syncfs:", err); } });
    }
  }, 15000);

  window.addEventListener("error", (e) => showError(String(e.message || e)));
</script>
<!-- PACKAGES -->
<script src="wesnoth.js"></script>
</body>
</html>
