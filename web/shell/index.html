<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Battle for Wesnoth (tarayıcı önizlemesi)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #e8dcc0; font-family: Georgia, serif; overflow: hidden; }
  #canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #0b0a08; text-align: center; padding: 24px; z-index: 5; }
  #overlay.translucent { background: rgba(11, 10, 8, 0.88); }
  #overlay h1 { font-weight: normal; font-size: 28px; margin: 0; letter-spacing: 0.04em; }
  #status { font-size: 15px; opacity: 0.85; min-height: 1.4em; }
  #bar { width: min(420px, 80vw); height: 6px; background: #2a2620; border-radius: 3px; overflow: hidden; }
  #bar > div { height: 100%; width: 0; background: #c9a85a; transition: width 0.2s; }
  #error { display: none; max-width: 640px; font-size: 14px; color: #f0a0a0; white-space: pre-wrap; text-align: left; }
  #note { font-size: 12px; opacity: 0.55; max-width: 520px; }
  #badge { display: none; position: fixed; left: 50%; bottom: 6px; transform: translateX(-50%); padding: 3px 10px; border-radius: 10px; background: rgba(0,0,0,0.65); color: #c9a85a; font: 12px Georgia, serif; z-index: 4; pointer-events: none; }
  #debuglog { display: none; position: fixed; right: 0; bottom: 0; width: 50vw; height: 40vh; overflow: auto; background: rgba(0,0,0,0.85); color: #9f9; font: 11px monospace; white-space: pre-wrap; z-index: 10; padding: 6px; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="badge"></div>
<div id="debuglog"></div>
<div id="overlay">
  <h1>The Battle for Wesnoth</h1>
  <div id="status">Yükleniyor…</div>
  <div id="bar"><div></div></div>
  <div id="error"></div>
  <div id="note">Deneysel tarayıcı sürümü. En iyi Chrome, Edge veya Firefox'ta çalışır; Safari ve iPhone'da uyumluluk sürümü kullanılır.
    Wesnoth özgür bir yazılımdır (GPL-2.0-or-later), bkz. wesnoth.org.</div>
</div>
<script>
  "use strict";
  const params = new URLSearchParams(location.search);
  const overlay = document.getElementById("overlay");
  const statusEl = document.getElementById("status");
  const barEl = document.querySelector("#bar > div");
  const errorEl = document.getElementById("error");
  const badgeEl = document.getElementById("badge");

  // Every line the game prints is kept in window.wesnothLog (and shown with ?debug).
  window.wesnothLog = [];
  const debugEl = document.getElementById("debuglog");
  const debugOn = params.has("debug");
  if (debugOn) { debugEl.style.display = "block"; }
  function logLine(kind, text) {
    window.wesnothLog.push(kind + " " + text);
    if (window.wesnothLog.length > 5000) { window.wesnothLog.shift(); }
    if (debugOn) {
      debugEl.textContent += kind + " " + text + "\n";
      debugEl.scrollTop = debugEl.scrollHeight;
    }
  }

  function showError(text) {
    overlay.style.display = "flex";
    errorEl.style.display = "block";
    errorEl.textContent = text;
    statusEl.textContent = "Bir sorun oluştu.";
  }

  // Two builds of the engine: "wesnoth" uses WebAssembly JSPI (Chrome, Edge,
  // Firefox), "wesnoth-asyncify" works everywhere else (Safari, every iOS
  // browser) at the cost of a bigger, somewhat slower engine. ?engine=asyncify
  // forces the second one for testing.
  const engineParam = new URLSearchParams(location.search).get("engine");
  const engineName = engineParam === "asyncify" || (engineParam !== "jspi" && typeof WebAssembly.Suspending !== "function")
    ? "wesnoth-asyncify" : "wesnoth";
  window.wesnothEngine = engineName;

  // --- Data packages -----------------------------------------------------
  // Only the "core" package is needed for the title screen. The background
  // packages (list written by package.sh into window.wesnothBackgroundPackages)
  // are fetched one by one once the game runs; a campaign's package
  // (window.wesnothCampaignPackages: campaign id -> package) only when the
  // campaign is started. The game calls Module.wesnothWaitForData(campaignId)
  // before it loads a map, and watches Module.wesnothDataVersion to refresh
  // its image caches.
  const packages = {
    background: window.wesnothBackgroundPackages || [],
    campaigns: window.wesnothCampaignPackages || {},
    state: {},          // name -> { promise, resolve, done }
    current: null,      // package whose download progress setStatus reports
    waiting: null,      // label shown while the game waits, or null
  };

  function packageState(name) {
    if (!packages.state[name]) {
      const st = { done: false, started: false };
      st.promise = new Promise((resolve) => { st.resolve = resolve; });
      packages.state[name] = st;
    }
    return packages.state[name];
  }

  function loadPackage(name) {
    const st = packageState(name);
    if (!st.started) {
      st.started = true;
      const script = document.createElement("script");
      script.src = name + ".js";
      script.onerror = () => logLine("js-error", "could not load " + script.src);
      document.body.appendChild(script);
    }
    return st.promise;
  }

  function onPackageUnpacked(name) {
    const st = packageState(name);
    if (st.done) { return; }
    st.done = true;
    st.resolve();
    Module.wesnothDataVersion = (Module.wesnothDataVersion | 0) + 1;
    logLine("data", "unpacked " + name);
    updateProgress();
  }

  function backgroundDone() {
    return packages.background.filter((n) => packageState(n).done).length;
  }

  async function loadBackgroundPackages() {
    for (const name of packages.background) {
      await loadPackage(name);
    }
  }

  // Progress in bytes of the unpacked package (GitHub Pages serves the
  // .data files gzipped, so file_packager's own totals are the compressed
  // sizes while its byte counts are not). Sizes come from package.sh.
  const packageSizes = window.wesnothPackageSizes || {};
  function packagePercent(names) {
    let loaded = 0, total = 0;
    for (const name of names) {
      const size = packageSizes[name] || 1;
      total += size;
      if (packageState(name).done) {
        loaded += size;
      } else {
        const d = Module.dataFileDownloads && Module.dataFileDownloads[name + ".data"];
        loaded += d ? Math.min(d.loaded, size) : 0;
      }
    }
    return total ? Math.min(99, Math.floor(100 * loaded / total)) : 100;
  }

  function updateProgress() {
    const n = packages.background.length;
    const done = backgroundDone();
    badgeEl.style.display = done >= n ? "none" : "block";
    badgeEl.textContent = "Oyun verileri arka planda indiriliyor… %" + packagePercent(packages.background);
    if (packages.waiting) {
      const pct = packagePercent(packages.needed);
      barEl.style.width = pct + "%";
      statusEl.textContent = packages.waiting + " %" + pct;
    }
  }

  var Module = {
    canvas: document.getElementById("canvas"),
    arguments: ["--data-dir=/wesnoth", "--userdata-dir=/userdata", "--nomusic", "--windowed", "--no-log-to-file"],
    print: (text) => { logLine("out", text); console.log(text); },
    printErr: (text) => { logLine("err", text); console.warn(text); },
    setStatus: (text) => {
      if (!text) { return; }
      if (window.wesnothStarted) {
        updateProgress();
        return;
      }
      const pct = packagePercent(["core"]);
      barEl.style.width = pct + "%";
      statusEl.textContent = "Oyun verileri indiriliyor… %" + pct;
    },
    // Download the engine gzipped (Pages serves .wasm uncompressed) and show
    // its progress; fall back to Emscripten's own loading if anything fails.
    instantiateWasm: (imports, receiveInstance) => {
      (async () => {
        let result;
        try {
          if (typeof DecompressionStream !== "function") { throw new Error("no DecompressionStream"); }
          const response = await fetch(engineName + ".wasm.gz");
          if (!response.ok) { throw new Error("HTTP " + response.status); }
          const total = Number(response.headers.get("content-length")) || 0;
          let loaded = 0;
          const counter = new TransformStream({
            transform(chunk, controller) {
              loaded += chunk.byteLength;
              if (total && !response.headers.get("content-encoding")) {
                const pct = Math.min(99, Math.floor(100 * loaded / total));
                barEl.style.width = pct + "%";
                statusEl.textContent = "Oyun motoru indiriliyor… %" + pct;
              }
              controller.enqueue(chunk);
            },
          });
          const wasm = response.body.pipeThrough(counter).pipeThrough(new DecompressionStream("gzip"));
          result = await WebAssembly.instantiateStreaming(
            new Response(wasm, { headers: { "Content-Type": "application/wasm" } }), imports);
        } catch (e) {
          logLine("js-error", "gzipped engine failed (" + e + "), loading " + engineName + ".wasm");
          statusEl.textContent = "Oyun motoru indiriliyor…";
          result = await WebAssembly.instantiateStreaming(fetch(engineName + ".wasm"), imports);
        }
        receiveInstance(result.instance, result.module);
      })().catch((e) => showError("Oyun motoru yüklenemedi: " + e));
      return {};
    },
    wesnothDataVersion: 0,
    wesnothWaitForData: async (campaignId) => {
      const needed = [...packages.background];
      const campaignPackage = campaignId && packages.campaigns[campaignId];
      if (campaignPackage) { needed.push(campaignPackage); }
      if (needed.every((n) => packageState(n).done)) { return; }
      packages.waiting = campaignPackage ? "Seferberlik verileri indiriliyor…" : "Harita için oyun verileri indiriliyor…";
      packages.needed = needed;
      overlay.classList.add("translucent");
      overlay.style.display = "flex";
      updateProgress();
      // the campaign first, then whatever background data is still missing
      if (campaignPackage) { await loadPackage(campaignPackage); }
      await Promise.all(packages.background.map((n) => loadPackage(n)));
      packages.waiting = null;
      overlay.style.display = "none";
    },
    preRun: [() => {
      // Language: Turkish by default, ?lang=en (or any locale) to override.
      // The game uses this until a language is picked in its preferences.
      const lang = params.get("lang") || "tr_TR";
      const locale = (lang === "en" ? "en_US" : lang).replace("-", "_");
      Module.ENV.LANG = locale + ".UTF-8";
      Module.ENV.LANGUAGE = locale;

      // Saves, preferences and add-ons live in IndexedDB.
      const FS = Module.FS;
      FS.mkdir("/userdata");
      const IDBFS = Module.IDBFS || (FS.filesystems && FS.filesystems.IDBFS) || window.IDBFS;
      FS.mount(IDBFS, { autoPersist: true }, "/userdata");
      Module.addRunDependency("syncfs-userdata");
      FS.syncfs(true, (err) => {
        if (err) { console.warn("Could not load saved data:", err); }
        Module.removeRunDependency("syncfs-userdata");
      });
    }],
    onRuntimeInitialized: () => {
      window.wesnothStarted = true;
      statusEl.textContent = "Başlatılıyor…";
      barEl.style.width = "100%";
      setTimeout(() => { if (!packages.waiting) { overlay.style.display = "none"; } }, 300);

      // Packages call Module.removeRunDependency("datafile_<path>/<name>.data")
      // once their files are in place.
      const removeRunDependency = Module.removeRunDependency;
      Module.removeRunDependency = (id) => {
        removeRunDependency(id);
        const m = /([\w-]+)\.data$/.exec(String(id));
        if (m) { onPackageUnpacked(m[1]); }
      };
      // Give the title screen a moment before the downloads compete with it.
      setTimeout(loadBackgroundPackages, 1500);
    },
    onExit: (code) => { logLine("exit", String(code)); },
    onAbort: (what) => {
      logLine("abort", String(what));
      showError("Oyun durdu: " + what + "\nAyrıntılar için tarayıcı konsolunu (F12) açın.");
    },
  };

  // SDL's fill-document mode moves every other element of the page into a
  // hidden <div>; bring the overlay, progress badge and debug log back.
  new MutationObserver(() => {
    const hidden = document.getElementById("SDL3_fill_document_background_elements");
    if (!hidden) { return; }
    for (const id of ["overlay", "badge", "debuglog"]) {
      const el = document.getElementById(id);
      if (el && hidden.contains(el)) { document.body.appendChild(el); }
    }
  }).observe(document.body, { childList: true });

  // The game only writes its preferences on exit, which never happens in a
  // tab; ask it to write them whenever the tab is hidden or closed.
  function savePreferences() {
    if (!window.wesnothStarted) { return; }
    try {
      if (Module._wesnoth_web_save_preferences) { Module._wesnoth_web_save_preferences(); }
      Module.FS.syncfs(false, (err) => { if (err) { console.warn("syncfs:", err); } });
    } catch (e) {
      logLine("js-error", "saving preferences: " + e);
    }
  }
  document.addEventListener("visibilitychange", () => { if (document.hidden) { savePreferences(); } });
  window.addEventListener("pagehide", savePreferences);

  // Fallback persistence in case autoPersist is not available.
  setInterval(() => {
    if (window.wesnothStarted && Module.FS) {
      Module.FS.syncfs(false, (err) => { if (err) { console.warn("syncfs:", err); } });
    }
  }, 15000);

  window.addEventListener("error", (e) => { logLine("js-error", String(e.message || e)); showError(String(e.message || e)); });
  function describeError(err) {
    if (err instanceof WebAssembly.Exception && Module.getExceptionMessage) {
      try {
        const [type, message] = Module.getExceptionMessage(err);
        return "C++ exception " + type + ": " + message + "\n" + (err.stack || "");
      } catch (e) { /* fall through */ }
    }
    return String(err && (err.stack || err));
  }
  window.addEventListener("unhandledrejection", (e) => {
    const text = describeError(e.reason);
    logLine("js-rejection", text);
    showError(text);
  });
</script>
<!-- PACKAGES -->
<script>
  (() => {
    const script = document.createElement("script");
    script.src = window.wesnothEngine + ".js";
    script.async = false;
    script.onerror = () => {
      const err = document.getElementById("error");
      document.getElementById("overlay").style.display = "flex";
      err.style.display = "block";
      err.textContent = "Bu tarayıcı için oyun motoru bulunamadı (" + script.src + ").";
    };
    document.body.appendChild(script);
  })();
</script>
</body>
</html>
