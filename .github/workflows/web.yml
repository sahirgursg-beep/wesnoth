name: Web (WebAssembly)

on:
  push:
    branches: [ web ]
    paths:
      - 'web/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  EMSDK_VERSION: 7.0.1
  WORK_DIR: /home/runner/webbuild
  VCPKG_BINARY_CACHE: /home/runner/webbuild/vcpkg-bincache
  LOG_DIR: /home/runner/webbuild/logs
  GAME_LOG_DIR: /home/runner/webbuild/logs-game
  CCACHE_DIR: /home/runner/webbuild/ccache
  CCACHE_MAXSIZE: 3G
  CCACHE_COMPILERCHECK: content

jobs:
  # Two engine builds: "jspi" (Chrome/Edge/Firefox) and "asyncify" (Safari and
  # every iOS browser, which lack WebAssembly JSPI). Each needs its own
  # dependency triplet because the exception model differs.
  build:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        variant: [jspi, asyncify]
    env:
      WEB_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf autoconf-archive automake libtool pkg-config \
            ninja-build bison flex gperf gettext python3-venv nasm ccache

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-wasm-${{ matrix.variant }}-${{ hashFiles('vcpkg.json', 'web/vcpkg/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-wasm-${{ matrix.variant }}-${{ hashFiles('vcpkg.json', 'web/vcpkg/**') }}-
            vcpkg-wasm-${{ matrix.variant }}-
            ${{ matrix.variant == 'jspi' && 'vcpkg-wasm-' || 'vcpkg-wasm-asyncify-' }}

      - name: Build dependencies
        run: web/ci/deps.sh

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-wasm-${{ matrix.variant }}-${{ hashFiles('vcpkg.json', 'web/vcpkg/**') }}-${{ github.run_id }}

      - name: Publish dependency logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: web/ci/publish-logs.sh "$LOG_DIR" deps-${{ matrix.variant }}

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-wasm-${{ matrix.variant }}-${{ github.run_id }}
          restore-keys: |
            ccache-wasm-${{ matrix.variant }}-
            ccache-wasm-

      - name: Build game
        id: game
        run: web/ci/game.sh

      - name: Save ccache
        if: always() && steps.game.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-wasm-${{ matrix.variant }}-${{ github.run_id }}

      - name: Publish game logs
        if: always() && steps.game.outcome != 'skipped'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: web/ci/publish-logs.sh "$GAME_LOG_DIR" game-${{ matrix.variant }}

      - name: Upload engine
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.variant }}
          path: |
            ${{ env.WORK_DIR }}/build/wesnoth.js
            ${{ env.WORK_DIR }}/build/wesnoth.wasm
          retention-days: 3

  site:
    name: Package site
    needs: build
    # deploy whatever engines were built (one failing variant must not block the other)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Host tools
        run: sudo apt-get install -y -qq gettext

      - name: emsdk (file_packager)
        run: |
          git clone -q --depth 1 https://github.com/emscripten-core/emsdk "$WORK_DIR/emsdk"
          cd "$WORK_DIR/emsdk" && ./emsdk install "$EMSDK_VERSION" >/dev/null && ./emsdk activate "$EMSDK_VERSION" >/dev/null

      - name: Download engines
        uses: actions/download-artifact@v4
        with:
          pattern: engine-*
          path: ${{ env.WORK_DIR }}/engines-raw

      - name: Package site
        run: |
          mkdir -p "$WORK_DIR/engines"
          for v in jspi asyncify; do
            [ -d "$WORK_DIR/engines-raw/engine-$v" ] && mv "$WORK_DIR/engines-raw/engine-$v" "$WORK_DIR/engines/$v"
          done
          ls -laR "$WORK_DIR/engines"
          ENGINES_DIR="$WORK_DIR/engines" web/ci/package.sh

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: /home/runner/webbuild/site

  deploy:
    name: Deploy to GitHub Pages
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
