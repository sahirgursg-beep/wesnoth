name: Web (WebAssembly)

on:
  push:
    branches: [ web ]
    paths:
      - 'web/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  EMSDK_VERSION: 7.0.1
  WORK_DIR: /home/runner/webbuild
  VCPKG_BINARY_CACHE: /home/runner/webbuild/vcpkg-bincache
  LOG_DIR: /home/runner/webbuild/logs

jobs:
  deps:
    name: Dependencies (vcpkg, wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf autoconf-archive automake libtool pkg-config \
            ninja-build bison flex gperf gettext python3-venv nasm

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-wasm-${{ hashFiles('vcpkg.json', 'web/vcpkg/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-wasm-${{ hashFiles('vcpkg.json', 'web/vcpkg/**') }}-
            vcpkg-wasm-

      - name: Build dependencies
        run: web/ci/deps.sh

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-wasm-${{ hashFiles('vcpkg.json', 'web/vcpkg/**') }}-${{ github.run_id }}

      - name: Publish logs to ci-logs branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: web/ci/publish-logs.sh "$LOG_DIR" deps
