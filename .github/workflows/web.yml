name: Web (WebAssembly)

on:
  push:
    branches: [ web ]
    paths:
      - 'web/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  EMSDK_VERSION: 7.0.1
  WORK_DIR: /home/runner/webbuild
  VCPKG_BINARY_CACHE: /home/runner/webbuild/vcpkg-bincache
  LOG_DIR: /home/runner/webbuild/logs
  GAME_LOG_DIR: /home/runner/webbuild/logs-game
  CCACHE_DIR: /home/runner/webbuild/ccache
  CCACHE_MAXSIZE: 3G
  CCACHE_COMPILERCHECK: content

jobs:
  deps:
    name: Dependencies (vcpkg, wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf autoconf-archive automake libtool pkg-config \
            ninja-build bison flex gperf gettext python3-venv nasm ccache

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-wasm-${{ hashFiles('vcpkg.json', 'web/vcpkg/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-wasm-${{ hashFiles('vcpkg.json', 'web/vcpkg/**') }}-
            vcpkg-wasm-

      - name: Build dependencies
        run: web/ci/deps.sh

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-wasm-${{ hashFiles('vcpkg.json', 'web/vcpkg/**') }}-${{ github.run_id }}

      - name: Publish dependency logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: web/ci/publish-logs.sh "$LOG_DIR" deps

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-wasm-${{ github.run_id }}
          restore-keys: ccache-wasm-

      - name: Build game
        id: game
        run: web/ci/game.sh

      - name: Save ccache
        if: always() && steps.game.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-wasm-${{ github.run_id }}

      - name: Publish game logs
        if: always() && steps.game.outcome != 'skipped'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: web/ci/publish-logs.sh "$GAME_LOG_DIR" game

      - name: Package site
        run: web/ci/package.sh

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: /home/runner/webbuild/site

  deploy:
    name: Deploy to GitHub Pages
    needs: deps
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
